[package]
name = "screen-captures"
version = "0.1.0"
edition = "2021"

[dependencies]
ashpd = {version = "0.13.11", features = ["screenshot"] }
fs_extra = "1.3"
glib = "0.22.7"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"]}
serde_json = "1.0"
libc = "0.2"
urlencoding = "2.1.3"
arboard = "3.6.1"
thiserror = "2.0.18"

[dependencies.adw]
package = "libadwaita"
version = "0.9.1"

[dev-dependencies]
tempfile = "3.8"
